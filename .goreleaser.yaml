version: 2

project_name: lfm

builds:
  - id: lfm
    main: ./cmd/lfm
    binary: lfm
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, SKILL.md, docs/*]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: lfm
    binaries: [lfm]
    description: "Sell before you build: your coding agent researches buyers and ships one checked landing page"
    homepage: https://lfm.cash
    license: MIT
    repository:
      owner: Anonyfox
      name: homebrew-tap
      git:
        url: 'git@github.com:Anonyfox/homebrew-tap.git'
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    commit_author:
      name: Maximilian Stroh
      email: Fox56@gmx.de
    directory: Casks
    skip_upload: auto
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lfm"]
          end

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: false
  prerelease: auto
