<!doctype html>
<!-- The social preview of this case study. Render at a 1200×630 viewport, device scale 1, and save
     the screenshot as assets/images/share.png. -->
<html lang="en">
<meta charset="utf-8">
<title>Case study share card</title>
<style>
@font-face { font-family: "Martian Mono"; src: url("../fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../fonts/atkinson-hyperlegible-next.woff2") format("woff2"); font-weight: 200 800; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff; color: #15171a; }
.panel { position: absolute; inset: 40px; border: 6px solid #15171a; box-sizing: border-box; }
.strip { margin: 0; padding: 22px 48px; background: #15171a; color: #ffffff; font: 800 34px/1 "Martian Mono", monospace; font-stretch: 112.5%; letter-spacing: 0.04em; }
h1 { margin: 52px 48px 28px; font: 700 76px/1.08 "Atkinson Hyperlegible Next", sans-serif; }
.names { margin: 0 48px; font: 600 32px/1.3 "Atkinson Hyperlegible Next", sans-serif; color: #c0141b; }
.date { position: absolute; left: 48px; bottom: 34px; margin: 0; font: 400 24px/1 "Martian Mono", monospace; color: #4b5058; }
</style>
<div class="panel">
  <p class="strip">LFM.CASH</p>
  <h1>Two product pages<br>in under an hour</h1>
  <p class="names">Sans Slop / Grok Bot Squad Kit</p>
  <p class="date">23 October 2026</p>
</div>
</html>
