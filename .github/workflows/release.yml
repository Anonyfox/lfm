name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test
        run: go test -race -timeout 15m ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: the binary reports the tag
        run: |
          bin=$(find dist -type f -name lfm -path '*linux_amd64*' | head -1)
          "$bin" version | tee "$RUNNER_TEMP/version"
          grep -Eq "^lfm v?${GITHUB_REF_NAME#v}( |\$)" "$RUNNER_TEMP/version"
