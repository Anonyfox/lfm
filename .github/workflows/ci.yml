name: CI

# macOS runners bill at 10x: they run for v* tags and manual runs only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running check of the same branch; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks all ./...
      - name: shellcheck the installer
        run: shellcheck -s sh install.sh scripts/*.sh

  # The race tests run in three parallel package groups (scripts/test-group.sh);
  # Codecov merges their coverage profiles.
  test:
    strategy:
      fail-fast: false
      matrix:
        group: [compile, book, rest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runners ship Chrome, so browser-backed tests run too; they skip where it is missing.
      # Ubuntu 24.04 restricts the user namespaces Chrome's sandbox needs; the runner's
      # Chrome has no AppArmor profile that would allow them.
      - name: allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install epubcheck
        run: |
          curl -fsSL https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          printf '#!/bin/sh\nexec java -jar "%s/epubcheck-5.4.0/epubcheck.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/epubcheck"
          chmod +x "$RUNNER_TEMP/epubcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: test
        run: sh scripts/test-group.sh ${{ matrix.group }} | xargs go test -race -timeout 15m -coverprofile=coverage.out -covermode=atomic
      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: ${{ matrix.group }}
          fail_ci_if_error: false

  # macOS runners bill at 10x: one job with every package, for v* tags and manual runs.
  test-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -timeout 15m ./...

  # Every fuzz target runs for 5s on every push, spread over eight parallel shards.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz every target briefly
        run: sh scripts/fuzz.sh 5s ${{ matrix.shard }} 8

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/lfm
          done
      - name: smoke test the binary
        run: |
          go build -o lfm ./cmd/lfm
          ./lfm init "$RUNNER_TEMP/smoke"
          ./lfm compile "$RUNNER_TEMP/smoke"
          test -f "$RUNNER_TEMP/smoke/output/index.html"
      - name: install.sh as root and as a user
        run: sh scripts/install-test.sh ./lfm
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=homebrew
      - name: archives are owned by root
        run: sh scripts/archive-owner.sh dist/*.tar.gz
