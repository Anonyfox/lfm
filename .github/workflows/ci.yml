name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runners ship Chrome, so browser-backed tests run too; they skip where it is missing.
      # Ubuntu 24.04 restricts the user namespaces Chrome's sandbox needs; the runner's
      # Chrome has no AppArmor profile that would allow them.
      - name: allow Chrome's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test
        run: go test -race -timeout 15m ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz every target briefly
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              # A short -fuzztime can end on "context deadline exceeded" while a
              # worker minimizes a new input; only a reported failing input fails.
              if ! out=$(go test -run '^$' -fuzz "^${target}\$" -fuzztime 5s "$pkg" 2>&1); then
                echo "$out"
                if echo "$out" | grep -q "Failing input" || ! echo "$out" | grep -q "context deadline exceeded"; then exit 1; fi
                echo "::notice::$target ended on the fuzzing deadline without a failing input"
              fi
              echo "::endgroup::"
            done
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/lfm
          done
      - name: smoke test the binary
        run: |
          go build -o lfm ./cmd/lfm
          ./lfm init "$RUNNER_TEMP/smoke"
          ./lfm compile "$RUNNER_TEMP/smoke"
          test -f "$RUNNER_TEMP/smoke/output/index.html"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
