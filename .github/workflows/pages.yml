name: Pages

# Deploys lfm.cash. site/ is an lfm project, compiled by the lfm built from this commit.

on:
  push:
    branches: [main]
    paths: ["site/**", "cmd/**", "internal/**", "go.mod", "go.sum", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: compile site with lfm
        run: |
          go build -o "$RUNNER_TEMP/lfm" ./cmd/lfm
          "$RUNNER_TEMP/lfm" compile site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/output
      - id: deployment
        uses: actions/deploy-pages@v4
