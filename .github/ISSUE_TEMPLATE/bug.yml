name: Bug report
description: Something in lfm does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps or project that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lfm --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant output of `lfm compile --json`. Remove anything private.
      render: json
